<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Fuhrpark — Foto im Vollbild</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body { margin: 0; font-family: "Inter", system-ui, sans-serif; background: #12160F; color: #EAF2EC; -webkit-font-smoothing: antialiased; }
a { color: #4FBF63; text-decoration: none; }
a:hover { color: #66DA66; text-decoration: underline; }
</style>
</head>
<body>

<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #12160F;">

  <div style="height: 64px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 24px;">
    <div style="display: flex; align-items: baseline; gap: 12px;">
      <span style="font-size: 15px; line-height: 22px; font-weight: 600; color: #EAF2EC;">VW Golf 1300 CL</span>
      <span style="font-size: 13px; line-height: 20px; color: #9FB0A6;">Foto 3 von 7</span>
    </div>
    <a href="detail-verkauf-desktop.html" aria-label="Vollbild schliessen" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-right: -10px; border-radius: 8px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9FB0A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
    </a>
  </div>

  <div style="flex-grow: 1; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 24px; padding: 0 24px;">

    <button type="button" aria-label="Vorheriges Foto" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0; background: #1B221C; border: 1px solid #2A332C; border-radius: 8px; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EAF2EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </button>

    <div style="flex-grow: 1; min-width: 0; display: flex; align-items: center; justify-content: center;">
      <div style="height: 640px; aspect-ratio: 2 / 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: #1B221C; border: 1px solid #2A332C; border-radius: 12px;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#9FB0A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path></svg>
        <span style="font-size: 13px; line-height: 20px; color: #9FB0A6;">[FOTO 3 — 2:3]</span>
      </div>
    </div>

    <button type="button" aria-label="Nächstes Foto" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0; background: #1B221C; border: 1px solid #2A332C; border-radius: 8px; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EAF2EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </button>

  </div>

  <div style="flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 16px 24px 24px;">

    <button type="button" aria-label="Foto 1 anzeigen" style="height: 64px; aspect-ratio: 3 / 2; display: flex; align-items: center; justify-content: center; padding: 0; background: #1B221C; border: 1px solid #2A332C; border-radius: 8px; font-size: 12px; line-height: 16px; color: #9FB0A6; font-family: inherit; cursor: pointer;">1</button>

    <button type="button" aria-label="Foto 2 anzeigen" style="height: 64px; aspect-ratio: 3 / 2; display: flex; align-items: center; justify-content: center; padding: 0; background: #1B221C; border: 1px solid #2A332C; border-radius: 8px; font-size: 12px; line-height: 16px; color: #9FB0A6; font-family: inherit; cursor: pointer;">2</button>

    <button type="button" aria-label="Foto 3 anzeigen" aria-current="true" style="height: 64px; aspect-ratio: 2 / 3; display: flex; align-items: center; justify-content: center; padding: 0; background: #1B221C; border: 1px solid #4FBF63; outline: 2px solid #4FBF63; outline-offset: 1px; border-radius: 8px; font-size: 12px; line-height: 16px; color: #EAF2EC; font-family: inherit; cursor: pointer;">3</button>

    <button type="button" aria-label="Foto 4 anzeigen" style="height: 64px; aspect-ratio: 3 / 2; display: flex; align-items: center; justify-content: center; padding: 0; background: #1B221C; border: 1px solid #2A332C; border-radius: 8px; font-size: 12px; line-height: 16px; color: #9FB0A6; font-family: inherit; cursor: pointer;">4</button>

    <button type="button" aria-label="Foto 5 anzeigen" style="height: 64px; aspect-ratio: 2 / 3; display: flex; align-items: center; justify-content: center; padding: 0; background: #1B221C; border: 1px solid #2A332C; border-radius: 8px; font-size: 12px; line-height: 16px; color: #9FB0A6; font-family: inherit; cursor: pointer;">5</button>

    <button type="button" aria-label="Foto 6 anzeigen" style="height: 64px; aspect-ratio: 3 / 2; display: flex; align-items: center; justify-content: center; padding: 0; background: #1B221C; border: 1px solid #2A332C; border-radius: 8px; font-size: 12px; line-height: 16px; color: #9FB0A6; font-family: inherit; cursor: pointer;">6</button>

    <button type="button" aria-label="Foto 7 anzeigen" style="height: 64px; aspect-ratio: 2 / 3; display: flex; align-items: center; justify-content: center; padding: 0; background: #1B221C; border: 1px solid #2A332C; border-radius: 8px; font-size: 12px; line-height: 16px; color: #9FB0A6; font-family: inherit; cursor: pointer;">7</button>

  </div>

</div>
</body>
</html>
